name: Release Windows ROCm 10

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag (for example, halo-rocm10-v1)'
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows-rocm10-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ROCM_PATH: C:\rocm10
      BUILD_DIR: build-rocm10-release
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate new release tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw 'Use a tag containing only letters, digits, dots, underscores, and hyphens.'
          }
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag.' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) { throw 'This tag already exists. Enter a new release tag.' }
          if ($LASTEXITCODE -ne 1) { throw 'Could not check existing tags.' }
          $global:LASTEXITCODE = 0

      - name: Download ROCm 10.0.0 for gfx1151
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'rocm10.tar.gz'
          $Url = 'https://stable.repo.amd.com/rocm/core/tarball/therock-dist-windows-gfx1151-10.0.0.tar.gz'
          curl.exe --fail --location --retry 3 --output $Archive $Url
          if ($LASTEXITCODE -ne 0) { throw 'ROCm SDK download failed.' }
          $ExpectedHash = '1293927B06B3B8D4BD7E0265823FB998BC9E0D83C68F33DCFA5D32663B30CE38'
          if ((Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash -ne $ExpectedHash) {
            throw 'ROCm SDK checksum mismatch.'
          }
          New-Item -ItemType Directory -Path $env:ROCM_PATH | Out-Null
          tar -xzf $Archive -C $env:ROCM_PATH --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'ROCm SDK extraction failed.' }
          Remove-Item -LiteralPath $Archive

      - name: Build and package Windows binaries
        run: |
          .\test-windows.ps1 -SourceOnly
          .\build-windows.ps1 -RocmPath $env:ROCM_PATH -BuildDir $env:BUILD_DIR -Jobs 4 -Portable
          .\scripts\package-windows-rocm10.ps1 -RocmPath $env:ROCM_PATH -BuildDir $env:BUILD_DIR

      - name: Publish release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $Assets = @(Get-ChildItem "$env:BUILD_DIR/release/*.zip", "$env:BUILD_DIR/release/*.sha256" | ForEach-Object FullName)
          if ($Assets.Count -ne 2) { throw 'Expected one ZIP and one checksum file.' }
          $Notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @(
            'Windows x64 build for Strix Halo (gfx1151), using ROCm 10.0.0.',
            '',
            'Extract the ZIP and run the tools in bin. ROCm runtime libraries are bundled; an AMD graphics driver is required.',
            '',
            "Source commit: $env:GITHUB_SHA"
          ) | Set-Content -LiteralPath $Notes -Encoding utf8
          $ReleaseArgs = @('release', 'create', $env:RELEASE_TAG) + $Assets + @(
            '--target', $env:GITHUB_SHA, '--title', $env:RELEASE_TAG, '--notes-file', $Notes
          )
          if ($env:PRERELEASE -eq 'true') { $ReleaseArgs += '--prerelease' }
          gh @ReleaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
